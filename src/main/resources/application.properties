spring.application.name=OpenAISpringAI

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5.4-mini
##//default 60sec
spring.ai.openai.timeout=10s
##default 3 tries
spring.ai.openai.max-retries=2
server.port=8081
spring.ai.ollama.base-url=http://localhost:11434

# The model name shown by "ollama list"
spring.ai.ollama.chat.model=llama3.2:1b
spring.ai.ollama.chat.temperature=0.3
